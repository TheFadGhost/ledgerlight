<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledgerlight</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="app-header">
    <span class="brand">Ledgerlight</span>
    <nav class="app-nav" aria-label="Main">
      <a href="/dashboard" data-nav="dashboard">Dashboard</a>
      <a href="/transactions" data-nav="transactions">Transactions</a>
      <a href="/import" data-nav="import">Import</a>
      <a href="/budgets" data-nav="budgets">Budgets</a>
      <a href="/rules" data-nav="rules">Rules</a>
      <a href="/settings" data-nav="settings">Settings</a>
    </nav>
    <button id="undo-btn" class="btn btn-ghost" type="button" title="Undo last bulk action (Ctrl+Z)">Undo</button>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="toasts" aria-live="polite" aria-atomic="false"></div>
  <div id="dialog-root"></div>
  <p id="sr-status" class="visually-hidden" role="status"></p>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
